# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# nice!view is enabled by the nice_view shield and uses its custom status screen.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=y

# For use with ZMK Studio
#CONFIG_ZMK_STUDIO=y


CONFIG_ZMK_POINTING=y
# Set deep sleep to 60 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Make Bluetooth stronger
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Change board name
CONFIG_ZMK_KEYBOARD_NAME="wsKorne"

#USB Logging for Heatmap
#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_LOG_BUFFER_SIZE=31768
#CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
#CONFIG_LOG_SPEED=y
