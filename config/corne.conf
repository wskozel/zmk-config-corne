# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# nice!view is enabled by the upstream nice_view shield and uses its custom status screen.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=y

# The upstream nice!view widget provides battery/output/layer status and selects WPM internally.
# Do not enable the built-in display widgets here; they define duplicate widget listeners.
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Keep the display off while the keyboard is idle.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=250

# For use with ZMK Studio
#CONFIG_ZMK_STUDIO=y


CONFIG_ZMK_POINTING=y

# Make Bluetooth stronger
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# Set deep sleep to 60 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000


# Change board name
CONFIG_ZMK_KEYBOARD_NAME="wsKorne"

#USB Logging for Heatmap
#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_LOG_BUFFER_SIZE=31768
#CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
#CONFIG_LOG_SPEED=y
